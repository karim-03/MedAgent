# MedAgent configuration — no hardcoded values in code, everything pulled from here.

llm:
  provider: ollama
  model: qwen2.5:7b-instruct-q4_K_M
  fallback_model: gemma3:4b   # used if VRAM contention with embeddings becomes an issue

embeddings:
  model: sentence-transformers/all-MiniLM-L6-v2
  device: cpu   # deliberate: keeps full VRAM budget free for the LLM

vector_store:
  backend: faiss
  index_path: embeddings/faiss_index

ml:
  dataset: heart_disease
  raw_path: data/raw/heart_raw.csv
  processed_dir: data/processed
  target_column: target
  flip_target_polarity: true   # confirmed correct — see docs/model_evaluation_findings.md (SHAP/clinical-direction cross-check)
  test_size: 0.2
  random_state: 42
  model_path: ml/models/best_model.joblib

agent:
  # The 13 fields the ML model needs. cp/restecg/slope/thal are nominal
  # categorical codes (see ml/training/preprocessing.py NOMINAL_COLUMNS)
  # — the agent asks for them in plain language and the Validation tool
  # maps plain language to these codes, never the reverse.
  required_fields:
    - age
    - sex
    - cp
    - trestbps
    - chol
    - fbs
    - restecg
    - thalach
    - exang
    - oldpeak
    - slope
    - ca
    - thal
  max_followup_questions: 8   # safety valve against an infinite intake loop

reporting:
  # Recommended follow-up is deterministic (probability -> tier), never
  # LLM-decided — same "LLM never makes the risk-relevant decision, only
  # narrates" separation already applied to disease prediction itself.
  # Thresholds are on prediction_probability; tiers are checked in order,
  # first match wins.
  disclaimer: >
    This is an educational capstone project, not a certified medical device.
    It is not validated for clinical use and must never be used to make real
    patient-care decisions. Please consult a qualified healthcare professional.
  risk_tiers:
    - max_probability: 0.4
      label: "Lower estimated risk"
      recommendation: "Discuss these results with a healthcare provider at your next routine visit."
    - max_probability: 0.7
      label: "Moderate estimated risk"
      recommendation: "Discuss these results with a primary care physician in the near future."
    - max_probability: 1.01   # covers the full remaining range up to and including 1.0
      label: "Higher estimated risk"
      recommendation: "Discuss these results with a healthcare provider promptly, such as a cardiologist."
